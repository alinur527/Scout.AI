name: scoutai
services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env.docker
    environment:
      DATABASE_URL: sqlite:////data/scoutai.db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
    volumes:
      - scoutai-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env.docker
    environment:
      DATABASE_URL: sqlite:////data/scoutai.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - scoutai-data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; p=pathlib.Path('/data/uploads/.worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<120"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  scoutai-data:
