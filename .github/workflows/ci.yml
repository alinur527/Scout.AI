name: ScoutAI checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend scripts
      - run: python -m compileall -q backend/app
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
        working-directory: frontend
      - run: python scripts/test_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-artifacts/e2e/**/*.png
            test-artifacts/e2e/**/results.json
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/configure_local.py --docker
      - run: docker compose -p scoutai-ci up --build -d --wait --wait-timeout 120
      - run: python scripts/e2e.py
        env:
          SCOUTAI_E2E_URL: http://127.0.0.1:8080
          SCOUTAI_E2E_API: http://127.0.0.1:8080/api
          SCOUTAI_E2E_MANAGED_WORKER: 'true'
      - run: docker compose -p scoutai-ci logs --no-color
        if: failure()
      - run: docker compose -p scoutai-ci down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-browser-evidence
          path: |
            test-artifacts/e2e/**/*.png
            test-artifacts/e2e/**/results.json
          retention-days: 7
