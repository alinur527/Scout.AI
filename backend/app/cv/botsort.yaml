# botsort.yaml
track_high_thresh: 0.3  # Порог первой ассоциации
track_low_thresh: 0.1   # Порог второй ассоциации
new_track_thresh: 0.4   # Порог для создания НОВОГО ID (подними его!)
track_buffer: 120       # ПАМЯТЬ: ждать 120 кадров (4 сек), прежде чем убить ID
match_thresh: 0.7       # Порог совпадения IoU
fuse_score: True        # Использовать оценку детекции при сопоставлении